body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:30}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;display:flex;align-items:center;gap:18px;padding:12px 18px}
header b{font-size:21px;font-weight:600;letter-spacing:1px;color:#000}header b span{color:var(--out)}
#burger{background:none;border:0;padding:4px;cursor:pointer;display:grid;gap:6px}#burger i{display:block;width:30px;height:4px;background:#000}
#drawer{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:0;right:0;z-index:19;background:#fff;box-shadow:0 14px 24px #0003;padding:6px 22px 18px;display:none;border-radius:0 0 28px 28px}
#drawer.on{display:block}#drawer a{display:block;padding:12px 2px;color:var(--blue);text-decoration:none;font-weight:700;font-size:18px;border-bottom:1px solid #e6eefb}
main{max-width:520px;margin:0 auto;padding:14px 20px 70px}
h1.t{font-size:44px;line-height:1.12;margin:10px 0 22px;text-align:center;color:#fff;font-weight:800;-webkit-text-stroke:9px var(--out);paint-order:stroke fill;letter-spacing:-.5px}
h2.sec{font-size:30px;color:#fff;-webkit-text-stroke:7px var(--out);paint-order:stroke fill;margin:26px 0 12px;font-weight:800;text-align:center}
.hero{min-height:calc(100vh - 150px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero .w{font-size:68px;font-weight:800;color:#fff;-webkit-text-stroke:9px var(--out);paint-order:stroke fill;margin:0;line-height:1;letter-spacing:-1px}
.hero .to{font-size:44px;font-weight:800;color:#fff;-webkit-text-stroke:7px var(--out);paint-order:stroke fill;margin:8px 0 0;line-height:1}
.hero .s{font-size:56px;font-weight:800;color:var(--blue);margin:6px 0 0;line-height:1.1}
.hero p{color:var(--blue);font-weight:700;font-size:24px;line-height:1.4;margin:6px 0 28px;opacity:.9}
.btn{border:0;border-radius:999px;background:#fff;color:var(--blue);font:700 28px 'Prompt',sans-serif;padding:18px 58px;cursor:pointer}
.btn.sm{font-size:19px;padding:12px 30px}.btn.pri{background:var(--blue);color:#fff}
.menu{display:grid;gap:22px;padding-right:34px}
.mc{position:relative;display:block;background:#fff;border-radius:46px;padding:28px 96px 28px 30px;text-align:left;border:0;width:100%;font-family:inherit;color:var(--blue);cursor:pointer;min-height:140px}
.mc b{display:block;font-size:30px;font-weight:800;line-height:1.15}.mc small{display:block;font-size:16px;font-weight:700;margin-top:4px;line-height:1.3}
.mc .stk{position:absolute;right:-34px;top:50%;transform:translateY(-50%) rotate(var(--r,0deg));width:var(--w,120px);height:auto}
.stk{filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 3px 4px #0003);pointer-events:none}
.mc:active{transform:scale(.98)}
.card{background:#fff;border-radius:44px;padding:26px 30px;margin-bottom:22px}
.card h3{margin:0 0 6px;color:var(--blue);font-size:26px;font-weight:800}.card p{margin:6px 0;white-space:pre-wrap;word-break:break-word;font-size:17px}
.meta{font-size:14px;opacity:.55}.empty{text-align:center;opacity:.8;padding:40px 16px;color:var(--blue);font-weight:700;font-size:20px}
input,textarea,select{width:100%;font:600 18px 'Prompt',sans-serif;padding:14px 20px;border-radius:26px;border:0;background:#fff;color:#000;margin:6px 0}
textarea{min-height:120px;resize:vertical;border-radius:34px;padding:18px 22px;font-size:22px;font-weight:700}
::placeholder{color:#000;opacity:.85}
.sw{display:flex;gap:14px;margin:4px 0 14px}.sw{flex-wrap:wrap}.sw button,.cpk{flex:none}.sw button{width:56px;height:56px;border-radius:50%;border:0;cursor:pointer}.sw button.on{box-shadow:0 0 0 4px #fff,0 0 0 7px var(--blue)}
.form{background:var(--cream);border-radius:46px;padding:26px 26px 28px;margin-bottom:22px}
.swipe{background:#fff;border-radius:46px;padding:28px 28px 70px;position:relative;margin-bottom:60px}
.ph{aspect-ratio:1/1.05;border-radius:34px;background:#c9d0da center/cover;display:grid;place-items:center;font-size:110px;font-weight:800;color:#fff}
.swipe h3{margin:14px 0 2px;font-size:28px;font-weight:800;color:var(--blue)}
.acts{position:absolute;left:0;right:0;bottom:-38px;display:flex;justify-content:space-between;align-items:center}

function starPath(cx,cy,R){const p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,r=i%2?R*.45:R;p.push((cx+r*Math.cos(a)).toFixed(1)+' '+(cy+r*Math.sin(a)).toFixed(1))}return 'M'+p.join('L')+'Z'}

function dayStars(){const d=new Date(),r=rnd(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate());return STARS.map((p,i)=>[i,r()]).sort((a,b)=>a[1]-b[1]).slice(0,13).map(a=>{const p=STARS[a[0]];return [p[0]+Math.round(r()*14-7),p[1]+Math.round(r()*12-6),Math.max(9,p[2]+Math.round(r()*4-2))]})}

/* ---------- data ---------- */
function sub(key,path){
  const f=s=>{D[key]=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));upd()};
  try{db.collection(path).onSnapshot(f,()=>{})}catch(e){}
}
async function put(col,obj){
  const o={...obj,ts:Date.now()};
  if(!db){D[col].unshift({id:rid(),...o});upd();return}
  try{await db.collection(col).doc(rid()).set(o)}catch(e){flash('บันทึกไม่สำเร็จ: ไม่มีสิทธิ์เขียน (ต้องได้รับเชิญเป็น Contributor ขึ้นไป)')}
}
async function del(col,id){
  if(!confirm('ลบรายการนี้?'))return;
  if(!db){D[col]=D[col].filter(x=>x.id!==id);upd();return}
  try{await db.collection(col).doc(id).delete()}catch(e){flash('ลบไม่สำเร็จ')}
}

function hex2hsl(h){const n=parseInt(h.slice(1),16),r=(n>>16)/255,g=((n>>8)&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let s=0,hh=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;hh*=60}return[Math.round(hh),Math.round(s*100),Math.round(l*100)]}
function hsl2hex(h,s,l){s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return '#'+[f(0),f(8),f(4)].map(v=>v.toString(16).padStart(2,'0')).join('')}

menu:{shell:()=>{
  const it=[['news','หอกระจายข่าว','แจ้งข่าวสารต่างๆในโรงเรียน',stk(megaSvg(),140,0)],['swipe','ปัดพอร์ตรุ่นพี่','ดูพอร์ตรุ่นพี่ที่ติดมหาลัย',stk(phoneSvg(),84,0)],['notes','โน้ตฝากบอก','ฝากบอกประจำวัน/เดือน',stk(wbSvg(),128,0)],['song','ส่งเพลงให้เธอ','ฝากเพลงให้...',stk(cassSvg('#e9c46a','stk'),130,-8)],['stars','สอยดาวรับพร','รับสิ่งดีๆก่อนเริ่มวัน',stk(treeSvg(false,'stk'),126,0)],['balloon','ลูกโป่งระบาย','ปล่อยเรื่องเศร้าลอยไปกับลูกโป่ง',stk(balloonSvg(),70,0)],['submit','แจ้งข่าวเพจ','แจ้งข่าวสารที่รู้ให้กับเพจ',stk(envSvg('stk'),124,-4)]];

swipe:{shell:()=>title('ปัดพอร์ตที่ใช่')+'<div id="dyn"></div>',dyn:()=>{
  const ids=D.saved.map(s=>s.id);
  const p=D.portfolios.filter(p=>!seen.includes(p.id)&&!ids.includes(p.id))[0];

notes:{shell:()=>title('ฝากบอกออนไลน์')+'<div class="tabs"><button data-a="tab" data-v="day">วันนี้</button><button data-a="tab" data-v="month">รายเดือน</button></div><div id="dyn"></div><div class="form"><div id="cs">'+swatch()+'</div><input id="nm" maxlength="30" placeholder="ชื่อสมมติ (ไม่ใส่ก็ได้)"><textarea id="tx" maxlength="200" placeholder="ใส่ข้อความ..."></textarea><button class="btn sm pri" data-a="postnote">แปะโน้ต</button></div>',

   const note=n=>'<div class="nt" style="background:'+hexOf(n.color)+';color:'+inkOn(n.color)+';transform:rotate('+((n.ts||0)%5-2)+'deg)">'+esc(n.text)+'<small>— '+esc(n.name||'ไม่ระบุชื่อ')+'</small>'+'</div>';

   const months=[...new Set([dayKey().slice(0,7),...D.notes.map(n=>n.month)])].sort().reverse();
   const l=D.notes.filter(n=>!n.hold&&n.month===S.month);
   return '<select data-a="month">'+months.map(m=>'<option value="'+m+'"'+(m===S.month?' selected':'')+'>'+monthTh(m)+'</option>').join('')+'</select><div class="wb'+' many'+'">'+(l.length?l.map(mini).join(''):'<div class="empty" style="width:100%;font-size:17px">เดือนนี้ยังไม่มีโน้ต</div>')+'</div>'}},
song:{shell:()=>title('ส่งเพลงให้เธอ')+'<div id="cassbox">'+cassSvg(S.cc)+'</div><div class="form"><div id="cs">'+swatch()+'</div><input id="sg" maxlength="80" placeholder="ชื่อเพลง (พิมพ์แค่ชื่อเพลงก็พอ)"><div id="sug"></div><div class="meta" style="margin:2px 4px 8px;opacity:.7">ใส่ชื่อเพลง แล้ววางลิงก์จากแอปไหนก็ได้ (กดแชร์ → คัดลอกลิงก์)</div><div class="row2"><input id="ln" placeholder="วางลิงก์เพลง (Spotify, YouTube หรือแอปอื่นๆ)"><button class="btn sm" data-a="paste">วาง</button></div><div id="lstat" class="meta" style="margin:0 6px 6px"></div><input id="to" maxlength="40" placeholder="ส่งถึงใคร"><input id="fr" maxlength="30" placeholder="จากชื่อสมมติ (ไม่ใส่ก็ได้)"><textarea id="tx" maxlength="150" style="min-height:80px;font-size:18px" placeholder="ข้อความสั้นๆ (ไม่ใส่ก็ได้)"></textarea><button class="btn sm pri" data-a="postsong">ส่งเทป</button></div><h2 class="sec">เทปที่ถูกส่งล่าสุด</h2><div id="dyn"></div>',
  dyn:()=>D.songs.length?D.songs.slice(0,30).map(s=>{const l=parseLink(s.url);return '<div class="card tp">'+cassSvg(hexOf(s.color),'')+'<div style="min-width:0"><b style="color:var(--blue);font-size:20px;word-break:break-word">'+esc(s.song)+'</b><div style="font-weight:700">ถึง: '+esc(s.to)+'</div>'+(s.text?'<div style="font-size:15px">'+esc(s.text)+'</div>':'')+(l?'<a class="play" target="_blank" rel="noopener noreferrer" href="'+esc(l.url)+'">▶ ฟังบน '+platName(l)+'</a>'+(l.plat!=='other'?'<button class="play" style="border:0;cursor:pointer;background:#e8ff95;color:#000" data-a="play" data-u="'+esc(l.url)+'">▶ ฟังที่นี่</button>':''):'')+'<div class="meta">จาก '+esc(s.name||'ไม่ระบุชื่อ')+' · '+thDate(s.ts)+'</div></div><div class="pl" style="flex-basis:100%"></div></div>'}).join(''):'<div class="card empty">ยังไม่มีเทปที่ถูกส่ง</div>'},
stars:{shell:()=>title('สอยดาวรับพร')+treeSvg(true)+'<div class="msg" id="msg">คำทำนาย...</div>',after:()=>starsInit()},
balloon:{shell:()=>title('ลูกโป่งระบายความในใจ')+'<div class="stage" id="stage"></div><div class="form"><div id="cs">'+balSw()+'</div><textarea id="tx" placeholder="ระบายเรื่องที่ไม่สบายใจได้เลย..."></textarea><div class="meta" style="margin-bottom:10px;opacity:.7">เลือกสีลูกโป่งได้ตามใจ ข้อความนี้ไม่ถูกบันทึกหรือส่งให้ใคร มันจะลอยหายไปกับลูกโป่ง</div><button class="btn sm pri" data-a="release">ปล่อยลูกโป่ง</button></div>',after:()=>drawBalloon()},

function oneBalloon(col,cls){return P('0 0 140 260','<ellipse cx="70" cy="88" rx="58" ry="74" fill="'+col+'" stroke="#444" stroke-width="2"/><ellipse cx="70" cy="88" rx="58" ry="74" fill="url(#hat)"/><ellipse cx="46" cy="52" rx="11" ry="19" fill="#fff" fill-opacity=".7" transform="rotate(25 46 52)"/><path d="M70 162l-8 12h16z" fill="'+col+'" stroke="#444"/><path d="M70 174q-10 30 4 52t-4 32" stroke="#777" fill="none" stroke-width="1.5"/>',cls)}
const balSw=()=>colSw('bal');
function drawBalloon(){const s=$('#stage');if(s)s.innerHTML=oneBalloon(S.bal,'bl" id="bl')}
function playerHtml(l){let u='',h=200;try{const x=new URL(l.url);if(l.plat==='youtube'){const id=x.hostname.endsWith('youtu.be')?x.pathname.slice(1):(x.searchParams.get('v')||(x.pathname.match(/\/(?:shorts|embed)\/([\w-]{11})/)||[])[1]);if(!/^[\w-]{11}$/.test(id||''))return '';u='https://www.youtube-nocookie.com/embed/'+id;h=210}else{const m=x.pathname.match(/\/(track|album|playlist|episode)\/([A-Za-z0-9]+)/);if(!m)return '';u='https://open.spotify.com/embed/'+m[1]+'/'+m[2];h=152}}catch(e){return ''}return '<iframe src="'+u+'" width="100%" height="'+h+'" style="border:0;border-radius:16px;margin-top:10px" allow="encrypted-media;autoplay;fullscreen" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" title="เครื่องเล่นเพลง"></iframe>'}
function suggest(){const el=$('#sug');if(!el)return;const q=val('sg').toLowerCase();if(q.length<2){el.innerHTML='';return}const seenU=new Set();const items=[...D.songlib,...D.songs].filter(x=>x.url&&(x.song||'').toLowerCase().includes(q)).filter(x=>{if(seenU.has(x.url)||!parseLink(x.url))return false;seenU.add(x.url);return true}).slice(0,5);
  el.innerHTML=items.length?'<div class="sugb">'+items.map(x=>{const l=parseLink(x.url);return '<div class="sugi"><div style="min-width:0;flex:1"><b>'+esc(x.song)+'</b><div class="meta">'+platName(l)+'</div></div><button data-a="usesong" data-u="'+esc(x.url)+'" data-t="'+esc(x.song)+'">เลือก</button>'+(l.plat!=='other'?'<button data-a="play" data-u="'+esc(x.url)+'">▶ ฟัง</button>':'')+'<div class="pl" style="flex-basis:100%"></div></div>'}).join('')+'</div>':'<div class="meta" style="margin:2px 6px 8px">ยังไม่มีเพลงนี้ในคลัง วางลิงก์เพลงด้านล่างได้เลย</div>'}
const platName=l=>l.plat==='spotify'?'Spotify':l.plat==='youtube'?'YouTube':({'music.apple.com':'Apple Music','soundcloud.com':'SoundCloud','joox.com':'JOOX','tiktok.com':'TikTok','deezer.com':'Deezer','music.line.me':'LINE MUSIC','tidal.com':'TIDAL','music.amazon.com':'Amazon Music'}[l.host]||l.host||'ลิงก์');
function parseLink(u){const m=String(u||'').match(/https?:\/\/\S+/);if(!m)return String(u||'').trim()?false:null;let x;try{x=new URL(m[0])}catch(e){return false}if(x.protocol!=='https:')return false;const h=x.hostname.replace(/^www\.|^m\./,'');if(h==='open.spotify.com'||h==='spotify.link')return{url:x.href,plat:'spotify'};if(h==='youtube.com'||h==='music.youtube.com'||h==='youtu.be')return{url:x.href,plat:'youtube'};return{url:x.href,plat:'other',host:h}}

  const base=t.replace(/[\u0e31\u0e34-\u0e3a\u0e47-\u0e4e]/g,'');
  if(base.length<3&&!/^(ดี|จ๊ะ|จ้า|ฮะ|ค่ะ|คะ|ครับ|นะ|ใช่|ไม่|ไป|มา|รัก|สู้)$/.test(t)&&(base.length<2||/^(อี|ไอ|ไอ้|ไอ่|ไอ๊|หั|เห|เหี|เหี้|เย|เย็|ควา|สัส|สัต|ส้น|ตีน|แม่|พ่อ|เวร|กา|ตอ|ดอก|หัว|ชา|เชี่|อ้า)$/.test(t)))return 'hold';
  const bad=[/ควย/,/เย็ด|เยด/,/หี(?!บ)/,/แม่ง(?!าน)|แมร่ง/,/เหี้ย(?!ม)/,/สัส/,/สัด(?!ส่วน)/,/ส้นตีน|ตีนแม่/,/ไอ้สัตว์|อีสัตว์|ไอสัตว์/,/ชาติหมา/,/ระยำ/,/ห่า(?![งนว])/,/ฉิบหาย|ชิบหาย/,/เชี่ย/,/ตอแหล/,/กะหรี่|อีตัว|แพศยา|อีดอก/,/ปากหมา/,/เฮงซวย|อัปรีย์|จัญไร/,/ไปตาย|ตายไปซะ|ตายซะ|ขอให้ตาย/,/พ่อมึง|แม่มึง/,/เสือก|เปรต/,/หมาหัว|ขี้หมา|หน้าหมา|หน้าตัวเมีย|เวรเอ๊ย|เวรตะไล/,/(ไอ้|ไอ่|ไอ๊|อ้าย|อี)(เวร|หมา|เหี้ย|ควาย|แรด|สถุน|สถุล|ขี้|โง่|กาก|ชั่ว|เลว|ต่ำ|สัตว์|ระยำ|ดอก|ตัว|บ้า)/,/fuck|shit|bitch|dick|pussy|asshole|cunt|slut|whore|bastard/];
  const hold=[/โง่|ควาย|ปัญญาอ่อน|เอ๋อ|ไร้สมอง|สมองหมา/,/ขี้โกหก|ขี้โกง|โกง(?!กาง)|ขโมย(?!หัวใจ)|นอกใจ|เป็นชู้|แย่งแฟน|ใจง่าย|ร่าน|หน้าด้าน|หน้าไม่อาย/,/น่ารังเกียจ|น่าเกลียด|ขี้เหร่|เหม็นหน้า|ตัวเหม็น|ตัวตลก|ตัวประหลาด|ไม่มีใครเอา|ไร้ค่า|น่ารำคาญ|ขยะสังคม|ไอ้บ้า|ไอ้โง่|อีบ้า|ไอ้ขี้|อีขี้|ตุ๊ด/,/(ไอ้|ไอ่|ไอ๊|อ้าย)./,/เวร(?!กรรม|ประจำ|ทำ|วัน|ห้อง|ตึก|สอบ)/,/กาก(?!บาท|อาหาร|ใย|กะรุน)/,/อวดดี|สันดาน|เกรียน|สอพลอ|แรด|เลวร้ายที่สุด|คนเลว/,/idiot|stupid|loser|stfu/];
  if(bad.some(r=>r.test(t)))return 'block';

  g.style.left=GD.x+'px';g.style.top=GD.y+'px';
  g.classList.toggle('op',GD.open&&!GD.hid);g.classList.toggle('tk',GD.hid);
  g.classList.toggle('rt',GD.x+GS/2>innerWidth/2);g.classList.toggle('dn',GD.y<190);
}
function gdBack(g){GD.hid=false;GD.open=true;GD.x=innerWidth-GS-12;GD.y=innerHeight-GS-24;gdPlace(g);gdPop(g)}
function gdPop(g){
  g.style.transformOrigin='50% 100%';
  g.animate([
    {transform:'translateY(150px) scale(.7,.7)',opacity:0,offset:0},
    {transform:'translateY(40px) scale(1.18,.78)',opacity:1,offset:.22},
    {transform:'translateY(-52px) scale(.86,1.2)',offset:.48},
    {transform:'translateY(0) scale(1.2,.8)',offset:.68},
    {transform:'translateY(-14px) scale(.95,1.07)',offset:.82},
    {transform:'none',opacity:1,offset:1}
  ],{duration:950,easing:'ease-out'});
  setTimeout(()=>quack(1),300)
}
function gdWig(im){im.animate([{transform:'rotate(0)'},{transform:'translateY(-10px) rotate(-12deg)'},{transform:'rotate(10deg)'},{transform:'translateY(-4px) rotate(-6deg)'},{transform:'none'}],{duration:480,easing:'ease-in-out'})}
function gdHop(im){im.animate([{transform:'scale(1.12) rotate(-6deg)'},{transform:'translateY(0) scale(1.18,.82)',offset:.35},{transform:'translateY(-12px) scale(.94,1.08)',offset:.65},{transform:'none'}],{duration:480,easing:'ease-out'})}
function gdEl(){
  let g=document.getElementById('gd');if(g)return g;
  g=document.createElement('div');g.id='gd';g.hidden=true;
  g.innerHTML='<div class="gdb"><div class="tb"><u></u><u></u><u></u><em>น้องเป็ดบอกทาง</em></div><div class="bd"><b></b><span></span><i>จิ้มเป็ด = ปิด/เปิด • ลาก = พาไปที่อื่น • ชิดขอบ = ซ่อนตัว</i></div></div><img alt="เป็ดมาสคอต" draggable="false" src="'+DUCK+'">';
  document.body.appendChild(g);
  const im=g.querySelector('img');let d=null;
  im.addEventListener('pointerdown',e=>{clearTimeout(GD.t);d={px:e.clientX,py:e.clientY,x:GD.x,y:GD.y,m:false};try{im.setPointerCapture(e.pointerId)}catch(x){}g.classList.add('dr');e.preventDefault()});
  im.addEventListener('pointermove',e=>{if(!d)return;const dx=e.clientX-d.px,dy=e.clientY-d.py;if(!d.m&&Math.hypot(dx,dy)<6)return;d.m=true;GD.hid=false;GD.x=d.x+dx;GD.y=d.y+dy;gdPlace(g)});
  const up=()=>{if(!d)return;g.classList.remove('dr');const m=d.m;d=null;
    if(!m){if(GD.hid)gdBack(g);else{GD.open=!GD.open;gdPlace(g);gdWig(im)}return}
    const W=innerWidth,H=innerHeight,cx=GD.x+GS/2,cy=GD.y+GS/2;
    if(cx<34||cx>W-34||cy>H-34){GD.hid=true;GD.open=false;
      if(cx<34){GD.x=-GS+22;GD.y=Math.max(4,Math.min(H-GS-4,GD.y))}
      else if(cx>W-34){GD.x=W-22;GD.y=Math.max(4,Math.min(H-GS-4,GD.y))}
      else{GD.y=H-22;GD.x=Math.max(4,Math.min(W-GS-4,GD.x))}
    }else{GD.x=Math.max(4,Math.min(W-GS-4,GD.x));GD.y=Math.max(4,Math.min(H-GS-4,GD.y))}
    gdPlace(g);if(!GD.hid)gdHop(im)};
  im.addEventListener('pointerup',up);im.addEventListener('pointercancel',up);
  window.addEventListener('resize',()=>{if(g.hidden||GD.hid)return;GD.x=Math.max(4,Math.min(innerWidth-GS-4,GD.x));GD.y=Math.max(4,Math.min(innerHeight-GS-4,GD.y));gdPlace(g)});
  return g}
function gdShow(){
  const g=gdEl(),t=GT[view];
  if(view==='home'||view==='admin'||!t){g.hidden=true;GD.v=null;return}
  if(GD.v===view&&!g.hidden)return;GD.v=view;
  g.querySelector('b').textContent=t[0];g.querySelector('span').textContent=t[1];
  const wasHidden=g.hidden;g.hidden=false;
  if(!GD.init){GD.init=true;GD.x=innerWidth-GS-12;GD.y=innerHeight-GS-24}
  if(GD.hid){gdPlace(g);return}
  GD.open=true;gdPlace(g);gdPop(g);clearTimeout(GD.t);GD.t=setTimeout(()=>{if(!GD.hid&&GD.v===view){GD.open=false;gdPlace(g)}},9000)
}

async function lkHash(pin,salt,it){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:it||LK.IT},k,256);return btoa(String.fromCharCode(...new Uint8Array(b)))}
function lkWatch(){try{db.collection('config').onSnapshot(s=>{const d=s.docs.find(x=>x.id==='lock');LK.cfg=d?d.data():null;if(!d&&!LK.ready){setTimeout(()=>{LK.ready=true;if(view==='admin'&&!LK.cfg){const a=document.activeElement&&document.activeElement.tagName;if(a!=='INPUT')admRender()}},800);return}LK.ready=true;if(view==='admin'){const a=document.activeElement&&document.activeElement.tagName;if(a!=='INPUT')admRender()}},()=>{LK.ready=true})}catch(e){LK.ready=true}}

  return '<div class="card lkc"><h3>'+IC.lock+' กุญแจชั้นที่ 2</h3><p>บัญชีของคุณผ่านชั้นแรกแล้ว ใส่รหัสผ่านหลังบ้านเพื่อเข้าต่อ</p><input id="lk1" type="password" autocomplete="current-password" placeholder="รหัสผ่านหลังบ้าน"'+(bl?' disabled':'')+'><button class="btn sm pri" data-a="lkopen"'+(bl?' disabled':'')+'>ปลดล็อก</button><div class="meta" id="lkm">'+(bl?'ใส่ผิดหลายครั้ง รอ '+bl+' วินาทีแล้วลองใหม่':'')+'</div></div>'}
setInterval(()=>{if(view==='admin'&&admin&&LK.until&&!LK.ok()){LK.until=0;admRender()}},10000);
document.addEventListener('click',()=>{if(view==='admin'&&LK.ok())LK.touch()});

route();
